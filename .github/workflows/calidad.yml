# Compila, ejecuta las pruebas unitarias con cobertura y envía el análisis a SonarCloud.
# Para SonarCloud: crea el proyecto en sonarcloud.io importando este repositorio,
# copia el token en GitHub (Settings > Secrets and variables > Actions > New secret: SONAR_TOKEN)
# y revisa que SONAR_ORG y SONAR_PROJECT coincidan con los que muestra SonarCloud.
name: Pruebas y SonarCloud

on:
  push:
    branches: [ main, Develop ]
  pull_request:
    branches: [ main, Develop ]
  workflow_dispatch:

env:
  SONAR_ORG: jeankt
  SONAR_PROJECT: JeanKT_Tu-Vaca

jobs:
  calidad:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar SonarScanner
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Iniciar análisis de SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ env.SONAR_PROJECT }}" /o:"${{ env.SONAR_ORG }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.exclusions="**/wwwroot/lib/**,**/BaseDeDatos/**"
          /d:sonar.coverage.exclusions="**/Program.cs,**/Views/**,**/wwwroot/**,**/Models/Entidades/**,**/Data/**,**/Servicios/CorreoService.cs,**/TuVaca.Tests/**"

      - name: Compilar
        run: dotnet build TUVACA.slnx -c Release

      - name: Pruebas unitarias con cobertura
        run: dotnet test TuVaca.Tests/TuVaca.Tests.csproj -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Terminar análisis de SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
